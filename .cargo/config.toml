# Cross-compilation linkers. Without these, cargo links a cross build with
# the host `cc` and the link fails (e.g. aarch64: rust-lld rejects
# --fix-cortex-a53-843419 from an x86_64 linker). The release workflow
# installs the same compilers via apt before building.
[target.aarch64-unknown-linux-gnu]
linker = "aarch64-linux-gnu-gcc"

[target.x86_64-pc-windows-gnu]
linker = "x86_64-w64-mingw32-gcc"
