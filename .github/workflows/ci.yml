name: ci

on:
  push:
    branches: [master]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Unit tests
        run: cargo test --release
      - name: Round trip, two processes on one machine
        run: cargo build && ./demo.sh

  windows:
    # The .exe we ship is built exactly this way. If this job breaks, the next
    # release has no Windows binary.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq gcc-mingw-w64-x86-64
      - run: rustup target add x86_64-pc-windows-gnu
      - name: Cross-compile the .exe
        run: cargo build --release --target x86_64-pc-windows-gnu
