[package]
name = "zapsend"
version = "0.0.8"
edition = "2021"
rust-version = "1.75"
description = "Headless, LocalSend-compatible file transfer over your local network"
license = "MIT"
repository = "https://github.com/Urdemonlord/zapsend"
keywords = ["localsend", "file-transfer", "lan", "airdrop", "cli"]
categories = ["command-line-utilities", "network-programming"]

[[bin]]
name = "zapsend"
path = "src/main.rs"

[dependencies]
anyhow = "1"
axum = "0.7"
axum-server = { version = "0.7", features = ["tls-rustls"] }
bytes = "1"
clap = { version = "4", features = ["derive"] }
dirs = "5"
futures-util = "0.3"
hex = "0.4"
indicatif = "0.17"
rcgen = "0.13"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
reqwest = { version = "0.12", default-features = false, features = [
    "json",
    "rustls-tls",
    "stream",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
socket2 = { version = "0.5", features = ["all"] }
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["io"] }
uuid = { version = "1", features = ["v4"] }

[profile.release]
strip = true
lto = true
codegen-units = 1
